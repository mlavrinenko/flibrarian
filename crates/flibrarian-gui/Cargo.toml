[package]
name = "flibrarian-gui"
description = "Tauri 2 desktop GUI for flibrarian"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "flibrarian-gui"

[[bin]]
name = "flibrarian-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
flibrarian-core = { path = "../flibrarian-core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2"

[features]
bundled-duckdb = ["flibrarian-core/bundled-duckdb"]

[lints]
workspace = true
