name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DUCKDB_VERSION: "1.4.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-19
          components: rustfmt

      - uses: oven-sh/setup-bun@v2

      - name: Install tools
        run: cargo install linecop

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check frontend
        run: |
          cd frontend && bun install --frozen-lockfile
          bunx --silent prettier --check .
          bun --silent run lint
          bunx svelte-check --tsconfig ./tsconfig.app.json --fail-on-warnings

      - name: Check file sizes
        run: linecop crates && linecop frontend

  check:
    name: Clippy + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-19
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install DuckDB system library
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip" -o /tmp/libduckdb.zip
          sudo unzip -o /tmp/libduckdb.zip -d /usr/lib/ libduckdb.so duckdb.h
          sudo mv /usr/lib/duckdb.h /usr/include/
          sudo ldconfig

      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --quiet

      - name: Test
        run: cargo test --workspace --quiet

  build-linux:
    name: Linux (CLI + Web + GUI)
    needs: [lint, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-19

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build

      - name: Build CLI
        run: cargo build -p flibrarian-cli --release --features bundled-duckdb

      - name: Build Web
        run: cargo build -p flibrarian-web --release --features bundled-duckdb

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build GUI
        run: cargo tauri build --bundles deb,rpm --features bundled-duckdb

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/flibrarian dist/flibrarian-cli-x86_64-unknown-linux-gnu
          cp target/release/flibrarian-web dist/flibrarian-web-x86_64-unknown-linux-gnu
          cp target/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    name: Windows (CLI + GUI)
    needs: [lint, check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-19

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: cd frontend && bun install --frozen-lockfile

      - name: Build CLI
        run: cargo build -p flibrarian-cli --release --features bundled-duckdb

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build GUI
        run: cargo tauri build --bundles msi,nsis --features bundled-duckdb

      - name: Collect artifacts
        run: |
          mkdir dist
          Copy-Item target\release\flibrarian.exe dist\flibrarian-cli-x86_64-pc-windows-msvc.exe
          Copy-Item target\release\bundle\msi\*.msi dist\ -ErrorAction SilentlyContinue
          Copy-Item target\release\bundle\nsis\*.exe dist\ -ErrorAction SilentlyContinue
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            flibrarian-cli-*
            flibrarian-web-*
            *.deb
            *.rpm
            *.msi
            *.exe
